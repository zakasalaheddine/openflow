name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Never `live`. A CI run that reaches fal spends real money on every push.
      FAL_MODE: replay
    steps:
      - uses: actions/checkout@v4

      # ffmpeg for video export and probing; fonts because the runner has none
      # and the text overlay would rasterise to an empty layer — an export that
      # silently ships without its headline, and a green suite.
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - uses: actions/setup-node@v4
        with:
          # One source for the pin. better-sqlite3's prebuild segfaults on some
          # 22.x patch releases, so "22" is not specific enough.
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Refuse to run against live fal
        run: |
          if [ "$FAL_MODE" = "live" ]; then
            echo "FAL_MODE=live in CI would bill real money per run." >&2
            exit 1
          fi

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
